<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindrisers Cybersecurity Course</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <section class="flex justify-center items-center min-h-screen p-6">
        <div class="max-w-sm bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
            <img 
                src="https://www.mindrisers.com.np/static/Images/courses/Cyber-Security.png" 
                alt="Cybersecurity course thumbnail"
                class="w-full h-48 object-cover"
            >
            <div class="p-5">
                <h2 class="text-xl font-semibold text-gray-800 mb-2">
                    Inside Mindrisers Cybersecurity
                </h2>
                <p class="text-gray-500 text-sm mb-4">
                    Learn the fundamentals of ethical hacking, network security, and real-world defense strategies.
                </p>
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors">
                    View Course
                </button>
            </div>
        </div>
    </section>
</body>
</html>
