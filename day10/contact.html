<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Safira</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            DEFAULT: '#6ba43a',
            dark: '#5c9330',
          }
        },
        fontFamily: {
          sans: ['Poppins', 'Arial', 'sans-serif'],
        }
      }
    }
  }
</script>
</head>
<body class="font-sans text-gray-800">

  <div class="max-w-[1200px] mx-auto px-6 py-16">
    <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-16">

      <!-- Left: Contact Us info -->
      <div>
        <h2 class="text-[28px] font-bold text-gray-900 mb-8">Contact Us</h2>

        <!-- Address -->
        <div class="pb-6 border-b border-gray-200">
          <div class="flex items-center gap-3 mb-3">
            <svg class="w-5 h-5 text-gray-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12l9-9 9 9"/>
              <path d="M5 10v10h14V10"/>
            </svg>
            <h3 class="text-[17px] font-bold text-gray-900">Address</h3>
          </div>
          <p class="text-[14px] text-gray-500 leading-relaxed">
            123 Main Street, Anytown, CA 12345 – USA
          </p>
        </div>

        <!-- Phone -->
        <div class="py-6 border-b border-gray-200">
          <div class="flex items-center gap-3 mb-3">
            <svg class="w-5 h-5 text-gray-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6l9 6 9-6"/>
              <rect x="2" y="4" width="20" height="16" rx="2"/>
            </svg>
            <h3 class="text-[17px] font-bold text-gray-900">Phone</h3>
          </div>
          <p class="text-[14px] text-gray-500 leading-relaxed">Mobile: (08) 123 456 789</p>
          <p class="text-[14px] text-gray-500 leading-relaxed">Hotline: 1009 678 456</p>
        </div>

        <!-- Email -->
        <div class="pt-6">
          <div class="flex items-center gap-3 mb-3">
            <svg class="w-5 h-5 text-gray-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
            </svg>
            <h3 class="text-[17px] font-bold text-gray-900">Email</h3>
          </div>
          <p class="text-[14px] text-gray-500 leading-relaxed">yourmail@domain.com</p>
          <p class="text-[14px] text-gray-500 leading-relaxed">support@roadthemes.com</p>
        </div>
      </div>

      <!-- Right: Contact form -->
      <div>
        <h2 class="text-[28px] font-bold text-gray-900 mb-8">Tell Us Your Message</h2>

        <form onsubmit="return false;" class="space-y-6">

          <div>
            <label class="block text-[14px] text-gray-600 mb-2">Your Name (required)</label>
            <input
              type="text"
              class="w-full border border-gray-300 rounded px-4 py-3 text-[14px] outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
            >
          </div>

          <div>
            <label class="block text-[14px] text-gray-600 mb-2">Your Email (required)</label>
            <input
              type="email"
              class="w-full border border-gray-300 rounded px-4 py-3 text-[14px] outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
            >
          </div>

          <div>
            <label class="block text-[14px] text-gray-600 mb-2">Subject</label>
            <input
              type="text"
              class="w-full border border-gray-300 rounded px-4 py-3 text-[14px] outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
            >
          </div>

          <div>
            <label class="block text-[14px] text-gray-600 mb-2">Your Message</label>
            <textarea
              rows="6"
              class="w-full border border-gray-300 rounded px-4 py-3 text-[14px] outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 resize-y"
            ></textarea>
          </div>

          <button
            type="submit"
            class="bg-brand hover:bg-brand-dark transition-colors text-white text-[13px] font-semibold tracking-wide px-9 py-3 rounded-full"
          >
            SEND
          </button>

        </form>
      </div>

    </div>
  </div>

</body>
</html>
