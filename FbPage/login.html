<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f0f2f5;
    }

    .login-box {
        width: 400px;
        padding: 30px;
    }

    .fb-logo {
        text-align: center;
        margin-bottom: 20px;
    }

    .fb-logo i {
        font-size: 50px;
        color: #1877f2;
    }

    .login-box h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #1c1e21;
    }

    .login-box input {
        width: 100%;
        padding: 16px 14px;
        margin-bottom: 15px;
        border: 1px solid #dddfe2;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    .login-box input:focus {
        border-color: #1877f2;
    }

    .login-box .login-btn {
        width: 100%;
        padding: 14px;
        background-color: #1877f2;
        color: #fff;
        border: none;
        border-radius: 25px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 15px;
    }

    .login-box .login-btn:hover {
        background-color: #166fe0;
    }

    .forgot {
        text-align: center;
        margin-bottom: 25px;
    }

    .forgot a {
        color: #1c1e21;
        text-decoration: none;
        font-size: 14px;
    }

    .create-account {
        display: block;
        width: 100%;
        padding: 12px;
        text-align: center;
        background: #fff;
        color: #1877f2;
        border: 1px solid #1877f2;
        border-radius: 25px;
        font-weight: bold;
        text-decoration: none;
        font-size: 16px;
        margin-bottom: 25px;
    }

    .brand {
        text-align: center;
        font-weight: bold;
        color: #444;
        font-size: 18px;
    }
</style>
</head>
<body>

    <div class="login-box">

        <div class="fb-logo">
            <i class="fa-brands fa-facebook"></i>
        </div>

<h2>Log into Facebook</h2>

        <input type="text" id="email" placeholder="Email or mobile number">
        <input type="password" id="password" placeholder="Password">

        <!-- Password visibility toggle -->
        <button type="button" id="togglePassword" class="toggle-btn">Show Password</button>

        <button class="login-btn" id="loginBtn">Log in</button>

        <div class="forgot">
            <a href="#" id="forgotLink">Forgot password?</a>
        </div>

        <a href="#" class="create-account" id="createAccount">Create new account</a>

        <div class="brand">Meta</div>

        <div id="message" class="message"></div>
    </div>

<script>
    // ------------------- Element references -------------------
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const loginBtn = document.getElementById('loginBtn');
    const messageDiv = document.getElementById('message');

    // ------------------- Toggle password visibility -------------------
    togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.textContent = isPassword ? 'Hide Password' : 'Show Password';
    });

    // ------------------- Helper to show messages -------------------
    function showMessage(text, isError = true) {
        messageDiv.textContent = text;
        messageDiv.style.color = isError ? '#e02424' : '#1877f2';
        messageDiv.style.marginTop = '10px';
        messageDiv.style.fontSize = '14px';
        messageDiv.style.textAlign = 'center';
    }

    // ------------------- Validation -------------------
    function validateLogin() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (email === '') {
            showMessage('Please enter your email or mobile number.');
            emailInput.style.borderColor = '#e02424';
            return false;
        }

        if (password === '') {
            showMessage('Please enter your password.');
            passwordInput.style.borderColor = '#e02424';
            return false;
        }

        // Basic email format check (if it looks like an email)
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email.includes('@') && !emailRegex.test(email)) {
            showMessage('Please enter a valid email address.');
            emailInput.style.borderColor = '#e02424';
            return false;
        }

        return true;
    }

    // Reset border on input
    emailInput.addEventListener('input', () => {
        emailInput.style.borderColor = '#1877f2';
        messageDiv.textContent = '';
    });
    passwordInput.addEventListener('input', () => {
        passwordInput.style.borderColor = '#1877f2';
        messageDiv.textContent = '';
    });

    // ------------------- Login handler -------------------
    loginBtn.addEventListener('click', () => {
        if (!validateLogin()) return;

        // Simulated login (replace with real authentication / API call)
        showMessage('Login successful! Redirecting...', false);

        // Redirect after a short delay (replace "home.html" with your target page)
        setTimeout(() => {
            window.location.href = 'home.html';
        }, 1200);
    });

    // Allow "Enter" key to submit
    passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            loginBtn.click();
        }
    });

    // ------------------- Demo suggestion -------------------
    loginBtn.addEventListener('dblclick', () => {
        emailInput.value = 'demo@example.com';
        passwordInput.value = 'password123';
        showMessage('Demo credentials filled!', false);
    });
</script>

</body>
</html>
